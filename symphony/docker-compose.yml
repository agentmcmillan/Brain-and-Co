services:
  symphony:
    build: .
    ports:
      - "9100:9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - ENTROPY_BEARER_TOKEN=${ENTROPY_BEARER_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SYMPHONY_API_TOKEN=${SYMPHONY_API_TOKEN}
    volumes:
      - symphony-data:/data/symphony
      - ~/.claude:/root/.claude:ro
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  symphony-data:
